<!DOCTYPE html>
<html>

<head>

    <style>
        body {

            margin: 0;
            padding: 0;

            color: black;

        .topbar {
            display: flex;

            align-items: center;

            color: yellow;
            padding-top: 0px;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 10px;
        }
    </style>
</head>

<body>
    <h1 class="topbar">Notes Journal App&#160;
        &#160; &#160; &#160; &#160; &#160;
        <button id="logoutBtn">Logout</button>
    </h1>
    <table id="notesList">
        <thead>
            <tr>
                <th>Title</th>
                <th>Body</th>
                <th>Created</th>
                <th>Updated</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
    <!-- Config.js is generated by NotesAspFrontEnd.cs -->
    <script src="/config.js"></script>
    <script src="/auth.js"></script>
    <script src="/notes.js"></script>
</body>

</html>
