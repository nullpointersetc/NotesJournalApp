<!DOCTYPE html>
<html>

<head>
    <title>Notes Journal App</title>
    <style>
        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: wheat;
            color: black;
            min-height: 100vh;
            position: relative;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: sienna;
            color: yellow;
            padding-top: 0px;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 10px;
        }

        .loginForm {
            position: fixed;
            top: 50vh;
            left: 50vw;
            transform: translate(-50%, -50%);
            width: max-content;
            padding: 20px;
            background: wheat;
            color: black;
        }

        div.userNameRow {
            margin-bottom: 1em;
        }

        div.passwordRow {
            margin-bottom: 1em;
        }

        label.loginLabel {
            display: inline-block;
            min-width: 7em;
        }

        input.loginInput {
            display: inline-block;
            min-width: 12em;
        }
    </style>
</head>

<body>
    <h1 class="topbar">Notes Journal App</h1>

    <form id="loginForm" class="loginForm">
        <div class="userNameRow">
            <label for="username" class="loginLabel">Username:</label>
            <input id="username" type="text" class="loginInput" />
        </div>
        <div class="passwordRow">
            <label for="password" class="loginLabel">Password:</label>
            <input id="password" type="password" class="loginInput" />
            <button type="submit">Login</button>
        </div>
        <div id="loginStatus"></div>
    </form>

    <script src="/config.js"></script>
    <script src="/auth.js"></script>
</body>

</html>
