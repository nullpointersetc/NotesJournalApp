<!DOCTYPE html>
<html>

<head>
    <title>Notes Journal App</title>
    <style>
        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: wheat;
            color: black;
            min-height: 100vh;
            position: relative;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: sienna;
            color: yellow;
            padding-top: 0px;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 10px;
        }

        .loginForm {
            position: fixed;
            top: 50vh;
            left: 50vw;
            transform: translate(-50%, -50%);
            width: max-content;
            padding: 20px;
            background: wheat;
            color: black;
        }
    </style>
</head>

<body>
    <h1 class="topbar">Notes Journal App</h1>

    <form id="loginForm" class="loginForm">
        <div>
            <label for="username">Username: <input id="username" type="text" /></label>
        </div>
        <div>
            <label for="password">Password:&#160; <input id="password" type="password" /></label>
            <button type="submit">Login</button>
        </div>
        <div id="loginStatus"></div>
    </form>

    <script src="/config.js"></script>
    <script src="/auth.js"></script>
</body>

</html>
